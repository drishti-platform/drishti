# The economist's Home (milestone H1): indicator strip with sparklines, exceptions about the data, the release calendar and headlines.
# Built only from library fragments (core of drishti-rachana). TODO(R2): home_indicators is served by the external-data module.
rachana: 1.2
sutra: home-economist
version: 1
libraries: [core@1]
title: { id: "'Economist'" }
data:
  meta:      { table: home_meta }
  ind:       { table: home_indicators, key: [LABEL] }
  ind_hist:  { table: home_indicator_history }
  exc:       { table: home_exceptions }
  mnem:      { table: home_mnemonics }
  cal:       { table: home_calendar }
  news:      { table: home_news }
  digest:    { table: home_digest }
  loads:     { table: home_loads }
  needs:     { table: home_needs }
  pinned:    { table: home_pinned }
layout:
  user-can-arrange: true
  areas:
    - "ind ind ind"
    - "exc cal news"
    - "needs needs pinned"
    - "loads loads loads"
    - "visit visit visit"
  columns: [4, 4, 4]
  phone: [ind, exc, cal, news, needs, pinned, loads, visit]
panels:
  - use: core/kpi-strip@1
    as: ind
    area: ind
    with:
      items: "map($.ind, {label: @.LABEL, value: @.VALUE, delta: @.DELTA, caption: @.CAPTION, open: @.OPEN})"
      history: { from: $.ind_hist, columns: { label: LABEL, date: DATE, value: VALUE } }
      fmt: compact
  - use: core/exceptions-list@1
    as: exc
    area: exc
    with:
      title: Data exceptions
      rows: { from: $.exc, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/calendar-list@1
    as: cal
    area: cal
    with:
      rows: { from: $.cal, columns: { date: DATE, time: TIME, title: TITLE, kind: KIND, open: COMMAND } }
  - use: core/headline-rail@1
    as: news
    area: news
    with:
      rows: { from: $.news, columns: { date: AT, headline: HEADLINE, source: SOURCE, link: LINK } }
  - use: core/exceptions-list@1
    as: needs
    area: needs
    with:
      title: Needs you
      rows: { from: $.needs, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/data-table@1
    as: pinned
    area: pinned
    with:
      title: Pinned
      search: false
      limit: 8
      rows: $.pinned
      columns: [ { label: Kind, bind: "@.KIND" }, { label: Id, bind: "@.ID" } ]
  - use: core/data-table@1
    as: loads
    area: loads
    with:
      title: Data loads
      search: false
      limit: 12
      rows: $.loads
      columns: [ { label: Pack, bind: "@.PACK" }, { label: Kind, bind: "@.KIND" }, { label: Business date, bind: "@.BUSINESS_DATE" }, { label: State, bind: "@.STATE" } ]
  - use: core/event-timeline@1
    as: visit
    area: visit
    with:
      title: Since you were here
      rows: { from: $.digest, columns: { date: AT, label: TEXT } }
