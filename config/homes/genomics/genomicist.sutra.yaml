# The genomicist's Home (milestone H1): the figures first, what needs a look, what changed since the cut-off and the quick mnemonics. Built only from
# library fragments (core of drishti-rachana); every table is a home table served for the person (ROLE_HOME_SUTRAS.md 2). Your Home's cards (the
# association plot, ClinVar updates, the loads) are the module's own and are served as genomics_* home tables.
rachana: 1.2
sutra: home-genomicist
version: 1
libraries: [core@1]
title: { id: "'Genomicist'" }
data:
  meta:      { table: home_meta }
  kpis:      { table: home_kpis,      key: [LABEL] }
  kpi_hist:  { table: home_kpi_history }
  exc:       { table: home_exceptions }
  chg:       { table: home_changes }
  mnem:      { table: home_mnemonics }
  digest:    { table: home_digest }
  gwas:      { table: genomics_gwas_top }
  manh:      { table: genomics_manhattan }
  clin:      { table: genomics_clinvar }
  gld:       { table: genomics_loads }
  modneeds:  { table: genomics_needs }
  loads:     { table: home_loads }
  pinned:    { table: home_pinned }
layout:
  user-can-arrange: true
  areas:
    - "kpis kpis kpis"
    - "exc chg rail"
    - "gwas manh manh"
    - "clin clin gld"
    - "needs needs needs"
    - "loads loads loads"
    - "visit visit visit"
  columns: [4, 5, 3]
  phone: [kpis, exc, chg, rail, gwas, manh, clin, gld, modneeds, loads, visit]
panels:
  - use: core/kpi-strip@1
    as: kpi
    area: kpis
    with:
      items: "map($.kpis, {label: @.LABEL, value: @.VALUE, delta: @.DELTA, caption: @.CAPTION, open: @.OPEN})"
      history: { from: $.kpi_hist, columns: { label: LABEL, date: DATE, value: VALUE } }
      fmt: compact
  - use: core/exceptions-list@1
    as: exc
    area: exc
    with:
      title: Needs a look
      rows: { from: $.exc, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/change-feed@1
    as: chg
    area: chg
    with:
      title: Since
      since: "first($.meta).SINCE"
      rows: { from: $.chg, columns: { key: SUBJECT, measure: MEASURE, before: THEN, after: NOW, change: CHANGE, why: WHY, kind: KIND, open: COMMAND } }
  - use: core/data-table@1
    as: pinned
    area: rail
    with:
      title: Pinned
      search: false
      limit: 8
      rows: $.pinned
      columns: [ { label: Kind, bind: "@.KIND" }, { label: Id, bind: "@.ID" } ]
  - use: core/data-table@1
    as: mnem
    area: rail
    with:
      title: Quick mnemonics
      search: false
      limit: 12
      rows: $.mnem
      columns: [ { label: Mnemonic, bind: "@.MNEMONIC" }, { label: About, bind: "@.ABOUT" } ]
  - use: core/data-table@1
    as: gwas
    area: gwas
    with:
      title: Top associations
      search: false
      limit: 6
      rows: $.gwas
      columns: [ { label: Gene, bind: "@.GENE" }, { label: Variant, bind: "@.VARIANT_ID" }, { label: Trait, bind: "@.TRAIT" }, { label: "-log10 p", bind: "@.NEG_LOG10_P", fmt: compact } ]
  - use: core/scatter-plot@1
    as: manh
    area: manh
    with:
      title: Association map
      x-label: Position along the genome (Mb, chromosomes end to end)
      y-label: -log10 p
      rows: { from: $.manh, columns: { x: X, y: Y, label: GENE, group: CHROM } }
  - use: core/data-table@1
    as: clin
    area: clin
    with:
      title: ClinVar updates for your genes
      search: false
      limit: 6
      rows: $.clin
      columns: [ { label: Gene, bind: "@.GENE" }, { label: Variant, bind: "@.VARIANT_ID" }, { label: Significance, bind: "@.SIGNIFICANCE" }, { label: Updated, bind: "@.UPDATED" } ]
  - use: core/data-table@1
    as: gld
    area: gld
    with:
      title: Genomics data loads
      search: false
      limit: 6
      rows: $.gld
      columns: [ { label: Source, bind: "@.SOURCE" }, { label: What, bind: "@.WHAT" }, { label: Date, bind: "@.DATE" }, { label: State, bind: "@.STATE" } ]
  - use: core/data-table@1
    as: modneeds
    area: modneeds
    with:
      title: Pipeline needs you
      search: false
      limit: 8
      rows: $.modneeds
      columns: [ { label: What, bind: "@.WHAT" }, { label: Detail, bind: "@.DETAIL" } ]
  - use: core/data-table@1
    as: loads
    area: loads
    with:
      title: Data loads
      search: false
      limit: 12
      rows: $.loads
      columns: [ { label: Pack, bind: "@.PACK" }, { label: Kind, bind: "@.KIND" }, { label: Business date, bind: "@.BUSINESS_DATE" }, { label: State, bind: "@.STATE" } ]
  - use: core/event-timeline@1
    as: visit
    area: visit
    with:
      title: Since you were here
      rows: { from: $.digest, columns: { date: AT, label: TEXT } }
