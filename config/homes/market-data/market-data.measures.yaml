# What the market-data Home follows (ROLE_HOME_SUTRAS 4): no figure of its own (the tiles are the module's market_tiles table, read as the person);
# the change detection has nothing to compare here yet, so "Since" shows the data's own events (loads) only.
home: market-data
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis: []
follow: []
events: [ load ]
exceptions:
  - { when: load-failed, severity: high, text: "{subject} failed the load check", open: "LOADS" }
  - { when: feed-late,   severity: low,  text: "{subject} is {minutes} minutes late", open: "FEEDS" }
mnemonics:
  - { mnemonic: "CRV", about: "A yield curve" }
  - { mnemonic: "FX", about: "An FX spot rate" }
  - { mnemonic: "EQ", about: "An equity price" }
  - { mnemonic: "CDS", about: "A credit curve" }
  - { mnemonic: "LOADS", about: "Data loads and their state" }
