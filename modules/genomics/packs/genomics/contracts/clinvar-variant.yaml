# The data contract of the kind clinvar-variant (section 5.2).
contract-format: 1
kind: clinvar-variant
version: "1.0"
binding-hint: read from the genomics lake (genomics.clinvar-variant); written by the clinvar feed (config/feeds/clinvar.yaml), never by the module
fields:
  - {name: VARIANT_ID, type: string, key: true}
  - {name: GENE, type: string}
  - {name: CHROM, type: string}
  - {name: POS, type: integer}
  - {name: REF, type: string}
  - {name: ALT, type: string}
  - {name: CONSEQUENCE, type: string}
  - {name: IMPACT, type: string}
  - {name: SIGNIFICANCE, type: string, means: "ClinVar clinical significance"}
  - {name: UPDATED, type: string, means: "when ClinVar last updated the record"}
