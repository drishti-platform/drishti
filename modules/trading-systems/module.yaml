# The trading-systems module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3; docs/plans/MODULE_RATIONALISATION.md S3): the trading data family. Its packs: `trading` (the one trade
# kind, its four derived kinds, the live blotter, the Java part java/trading-service) and one pack a source system (endur, calypso, murex, wss, swapone, ici: connectors,
# map, inbox rule, deal screens), each switched on or off on its own in Admin -> Artifacts. It ships the trade blotter, a live table of Rachana's engine (blotters/trade.live.yaml): the trades from the
# durable store, ticking from the `trade` kind's live: binding (config/bindings.yaml), editable where the site and the person's rights
# allow it, written back through the binding's write path. Not an order or execution system: no venue orders, no FIX.
format: 1
id: trading-systems
version: 1.0.0
title: Trading systems
about: 'The trade kind and the systems that feed it (Endur, Calypso, Murex, WSS, SwapOne, ICI), one pack each, and the live trade blotter: trades ticking in milliseconds from the bank''s messaging, edits written back
  through the bindings (a version per trade, an outbox, four eyes where the site asks, full audit)'
domain: trading
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: trading
requires:
  market-data: '>=1.0 <2'
  reference-data: '>=1.0 <2'
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=3.3 <4'
provides:
  kinds:
    trading:
    - trade
    - counterparty-trades
    - portfolio-trades
    - legal-entity-trades
    - index-trades
packs:
  folder: packs
  list:
  - trading
  - endur
  - calypso
  - murex
  - wss
  - swapone
  - ici
  off-by-default:                      # the site switches a source system on (Admin -> Artifacts); the demo profile has endur, calypso and murex on
  - endur
  - calypso
  - murex
  - wss
  - swapone
  - ici
data:
  needs: data/needs.yaml
functions:
- TRD
- CTRD
- PTRD
- LTRD
- ITRD
java:                                  # the server part (java/trading-service): the landings' figures, read as the person (THIN_CONSOLE_DESIGN.md S8a)
  jars:
  - drishti-trading.jar
  lib: []
  spring:
  - com.ash.drishti.trading.TradingAutoConfiguration
api:
  prefix: trading
console:
  plugin: console/plugin.yaml          # the Trading menu: the trade blotter (/live/trade)
  # the module's own top menus, in the console sitemap's form (drishti-console/config/sitemap.yaml): the Blotter menu moved here from the risk module
  menus:
  - id: blotter
    domain: banking
    label: Blotter
    icon: journal-text
    subject: true
    columns:
    - title: Trades
      items:
      - id: trd
        cmd: TRD
        icon: journal-text
        label: Trades
        desc: 'Every trade: pick one or filter'
        requires: ['cmd:TRD']
      - id: ctrd
        cmd: CTRD
        icon: building
        label: By counterparty
        desc: The trades of a counterparty
        requires: ['cmd:CTRD']
      - id: ptrd
        cmd: PTRD
        icon: folder2
        label: By portfolio
        desc: The trades of a portfolio
        requires: ['cmd:PTRD']
      - id: ltrd
        cmd: LTRD
        icon: bank
        label: By legal entity
        desc: The trades of a legal entity
        requires: ['cmd:LTRD']
blotters:
  folder: blotters
  list:
  - trade
parts:
  feeds: {class: feed, contains: [live-sets]}       # the listener: one runner per placement (KERNEL_AND_MODULES.md section 4.11.2)
  console: {class: light, contains: [console-bundle, help]}
docs:
  readme: docs/README.md
  help: docs/help.yaml
  guides:
  - guides/BANK_DATA_GUIDE.md
  tutorials:
  - guides/BANK_DATA_GUIDE.md
resources:
  memory-mb: 64
