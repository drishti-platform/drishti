# The Calypso source pack (docs/plans/MODULE_RATIONALISATION.md, S3): one trading system feeding the one canonical `trade` kind
# (SOURCE_SYSTEM = CALYPSO). It owns no kind: it extends `trading` and brings what is the system's own, in this folder: its connector
# templates (connectors: below), the mapping of its native fields to the canonical ones (mappings:), its inbox routing rule (dataload:)
# and its deal screens (sutras/). The pack is the switch (Admin -> Artifacts): off, the system's trades leave the trade kind, its
# connectors stop, its screens and Help page are not offered and nothing else changes. Who sees its trades is a row rule on SOURCE_SYSTEM.
pack: calypso
domain: banking
version: 1.0.0
code: CLYP
title: Calypso
description: Calypso trades (rates, credit, structured), one table of their own
extends:
- trading
kinds: []
sutras: sutras
sections:                      # what the pack adds to another kind's record page (KERNEL_AND_MODULES.md, Pack sections)
- kind: trade
  when: "$.SOURCE_SYSTEM == 'CALYPSO'"
  file: sutras/calypso-native-fields.v1.section.yaml
connectors:
  trade-calypso:
    # Template of this pack (a site file of the same name in config/connectors/ is merged over it; a copy to start from: config/connectors/trade-calypso.yaml). Calypso's trades from the demo Delta lake: its own table trading.trade_calypso.
    # map:, where: and set: are the trade kind's source options (docs/guides/BANK_DATA_GUIDE.md, "Source systems").
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - trade
    description: Calypso trades read from its own table trading.trade_calypso in the Delta lake
    settings:
      lake: demo
      lake-tables: trading.trade_calypso
      union: true
      source-name: trade-calypso
      set:
        SOURCE_SYSTEM: CALYPSO
      map: ${pack.dir}/mappings/calypso-trade.yaml
  trade-calypso-live:
    # The template of trade-calypso-live (a pack that is on brings it; KERNEL_AND_MODULES.md section 18.5): off until DRISHTI_STREAM_<SYSTEM>=true or a site override (config/connectors/trade-calypso-live.yaml: enabled: true) switches it on.
    # Calypso's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
    # trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
    # until an administrator switches them on (Admin -> Edits).
    plugin: kafka
    enabled: ${DRISHTI_STREAM_CALYPSO:false}
    kinds:
    - trade
    description: Calypso's live trades, and the trade blotter's amendments written back to them
    settings:
      broker: default
      topics:
      - ${DRISHTI_CALYPSO_TOPIC:drishti.trading.calypso.trades}
      kind: trade
      id-field: TRADE_ID
      stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
      source-name: trade-calypso-live
      set:
        SOURCE_SYSTEM: CALYPSO              # the record's system: its corrections go back to this connector (section 18.6)
    writes:
      amend-trade:                          # the trade blotter's command (modules/trading-systems/blotters/trade.live.yaml): one name, each system's own connector
        kind: trade
        kafka:
          topic: ${DRISHTI_CALYPSO_TOPIC:drishti.trading.calypso.trades}
          shape: document
          version-field: TRADE_VERSION
          changed-by: UPDATED_BY
          changed-at: SOURCE_UPDATE_TIME
          change-id-field: DRISHTI_CHANGE_ID
        confirm: reply
dataload: dataload.yaml
mappings:
  trade: mappings/calypso-trade.yaml

roles:                         # an example role of this system: who sees its trades is a row rule on SOURCE_SYSTEM (KERNEL_AND_MODULES.md section 19.10)
  trader-calypso:
    kinds:
    - trade
    edit: true
    rows:
      trade: "SOURCE_SYSTEM = 'CALYPSO'"
    edit-systems:
    - CALYPSO

# The table this pack's connector writes: its layout (the Delta connector's lake-tables names it; the loader reads it from here).
lake:
  tables:
    trading.trade_calypso:
      kind: trade
      partition-by:
      - PRODUCT_GROUP
      promote:
      - TRADE_ID
      - SOURCE_SYSTEM
      - PRODUCT_TYPE
      - PRODUCT_SUB_TYPE
      - PRODUCT_GROUP
      - TRADE_STATUS
      - TRADE_VERSION
      - BUY_SELL_CODE
      - CURRENCY
      - QUANTITY
      - TRADE_DATE
      - MATURITY_DATE
      - COUNTERPARTY
      - LEGAL_ENTITY
      - PORTFOLIO
      - TRADER_ID
      - NOTIONAL
      - INDEX_NAME
      sort-by:
      - id
      file-rows: 250000
      row-group-rows: 1000

ingest:
  trade:
    key: TRADE_ID
    flatten:
      NOTIONAL: LEGS[0].NOTIONAL
      INDEX_NAME: LEGS[0].INDEX.NAME
