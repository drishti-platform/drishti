# The native-fields section of the Calypso pack (docs/architecture/KERNEL_AND_MODULES.md, "Pack sections"): appended to the trade record page for
# the rows whose SOURCE_SYSTEM is CALYPSO and for no others; the pack's switch is its switch (off: the section is gone). Each line is a native
# field of the system (its own name) with the canonical field it feeds.
rachana: 1.2
sutra: calypso-native-fields
version: 1
description: "The Calypso fields of a trade, under their Calypso names."
match: { kind: trade, where: "$.SOURCE_SYSTEM == 'CALYPSO'" }
title: { pill: "Calypso", id: $.TRADE_ID }
panels:
  - id: calypso-native-fields
    kind: kv
    title: "Calypso native fields"
    columns:
      - { label: "Trade id (TRADE_ID)", bind: "nonblank($.TRADE_ID, '–')" }
      - { label: "Transaction id (TRANSACTION_ID)", bind: "nonblank($.TRANSACTION_ID, '–')" }
      - { label: "Version (TRADE_VERSION)", bind: "nonblank($.TRADE_VERSION, '–')" }
      - { label: "Status (TRADE_STATUS)", bind: "nonblank($.TRADE_STATUS, '–')" }
      - { label: "Last updated (SOURCE_UPDATE_TIME)", bind: "nonblank($.SOURCE_UPDATE_TIME, '–')" }
      - { label: "Updated by (UPDATED_BY)", bind: "nonblank($.UPDATED_BY, '–')" }
