# The Endur source pack (docs/plans/MODULE_RATIONALISATION.md, S3): one trading system feeding the one canonical `trade` kind
# (SOURCE_SYSTEM = ENDUR). It owns no kind: it extends `trading` and brings what is the system's own, in this folder: its connector
# templates (connectors: below), the mapping of its native fields to the canonical ones (mappings:), its inbox routing rule (dataload:)
# and its deal screens (sutras/). The pack is the switch (Admin -> Artifacts): off, the system's trades leave the trade kind, its
# connectors stop, its screens and Help page are not offered and nothing else changes. Who sees its trades is a row rule on SOURCE_SYSTEM.
pack: endur
domain: banking
version: 1.0.0
code: ENDR
title: Endur
description: Endur trades (energy, commodities, rates), one table of their own
extends:
- trading
kinds: []
sutras: sutras
connectors:
  trade-endur:
    # Template of this pack (a site file of the same name in config/connectors/ is merged over it; a copy to start from: config/connectors/trade-endur.yaml). Endur's trades from the demo Delta lake: its own table trading.trade_endur.
    # map:, where: and set: are the trade kind's source options (docs/guides/BANK_DATA_GUIDE.md, "Source systems").
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - trade
    description: Endur trades read from its own table trading.trade_endur in the Delta lake
    settings:
      lake: demo
      lake-tables: trading.trade_endur
      union: true
      source-name: trade-endur
      set:
        SOURCE_SYSTEM: ENDUR
      map: ${pack.dir}/mappings/endur-trade.yaml
  trade-endur-live:
    # The template of trade-endur-live (a pack that is on brings it; KERNEL_AND_MODULES.md section 18.5): off until DRISHTI_STREAM_<SYSTEM>=true or a site override (config/connectors/trade-endur-live.yaml: enabled: true) switches it on.
    # Endur's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
    # trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
    # until an administrator switches them on (Admin -> Edits).
    plugin: kafka
    enabled: ${DRISHTI_STREAM_ENDUR:false}
    kinds:
    - trade
    description: Endur's live trades, and the trade blotter's amendments written back to them
    settings:
      broker: default
      topics:
      - ${DRISHTI_ENDUR_TOPIC:drishti.trading.endur.trades}
      kind: trade
      id-field: TRADE_ID
      stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
      source-name: trade-endur-live
      set:
        SOURCE_SYSTEM: ENDUR                # the record's system: its corrections go back to this connector (section 18.6)
    writes:
      amend-trade:                          # the trade blotter's command (modules/trading-systems/blotters/trade.live.yaml): one name, each system's own connector
        kind: trade
        kafka:
          topic: ${DRISHTI_ENDUR_TOPIC:drishti.trading.endur.trades}
          shape: document
          version-field: TRADE_VERSION
          changed-by: UPDATED_BY
          changed-at: SOURCE_UPDATE_TIME
          change-id-field: DRISHTI_CHANGE_ID
        confirm: reply
dataload: dataload.yaml
mappings:
  trade: mappings/endur-trade.yaml

roles:                         # an example role of this system: who sees its trades is a row rule on SOURCE_SYSTEM (KERNEL_AND_MODULES.md section 19.10)
  trader-endur:
    kinds:
    - trade
    edit: true
    rows:
      trade: "SOURCE_SYSTEM = 'ENDUR'"
    edit-systems:
    - ENDUR
