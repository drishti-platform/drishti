# The WSS source pack (docs/plans/MODULE_RATIONALISATION.md, S3): one trading system feeding the one canonical `trade` kind
# (SOURCE_SYSTEM = WSS). It owns no kind: it extends `trading` and brings what is the system's own, in this folder: its connector
# templates (connectors/), the mapping of its native fields to the canonical ones (mappings/), its inbox routing rule (dataload.yaml)
# and its deal screens (sutras/). The pack is the switch (Admin -> Artifacts): off, the system's trades leave the trade kind, its
# connectors stop, its screens and Help page are not offered and nothing else changes. Who sees its trades is a row rule on SOURCE_SYSTEM.
pack: wss
domain: banking
version: 1.0.0
code: WSSX
title: WSS
description: WSS treasury, FX and money-market deals, in the shared trades table (mocked data)
extends:
- trading
kinds: []
roles:                         # an example role of this system: who sees its trades is a row rule on SOURCE_SYSTEM (KERNEL_AND_MODULES.md section 19.10)
  trader-wss:
    kinds:
    - trade
    edit: true
    rows:
      trade: "SOURCE_SYSTEM = 'WSS'"
    edit-systems:
    - WSS
