# The WSS source pack (docs/plans/MODULE_RATIONALISATION.md, S3): one trading system feeding the one canonical `trade` kind
# (SOURCE_SYSTEM = WSS). It owns no kind: it extends `trading` and brings what is the system's own, in this folder: its connector
# templates (connectors: below), the mapping of its native fields to the canonical ones (mappings:), its inbox routing rule (dataload:)
# and its deal screens (sutras/). The pack is the switch (Admin -> Artifacts): off, the system's trades leave the trade kind, its
# connectors stop, its screens and Help page are not offered and nothing else changes. Who sees its trades is a row rule on SOURCE_SYSTEM.
pack: wss
domain: banking
version: 1.0.0
code: WSSX
title: WSS
description: WSS treasury, FX and money-market deals, in the shared trades table (mocked data)
extends:
- trading
kinds: []
connectors:
  trade-wss:
    # Template of this pack (a site file of the same name in config/connectors/ is merged over it; a copy to start from: config/connectors/trade-wss.yaml). WSS's trades from the demo Delta lake: its own table trading.trade_wss (one table a trading system).
    # map:, where: and set: are the trade kind's source options (docs/guides/BANK_DATA_GUIDE.md, "Source systems").
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - trade
    description: WSS trades read from its own table trading.trade_wss in the Delta lake
    settings:
      lake: demo
      lake-tables: trading.trade_wss
      union: true
      source-name: trade-wss
      set:
        SOURCE_SYSTEM: WSS
      map: ${pack.dir}/mappings/wss-trade.yaml
  trade-wss-live:
    # The template of trade-wss-live (a pack that is on brings it; KERNEL_AND_MODULES.md section 18.5): off until DRISHTI_STREAM_<SYSTEM>=true or a site override (config/connectors/trade-wss-live.yaml: enabled: true) switches it on.
    # WSS's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
    # trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
    # until an administrator switches them on (Admin -> Edits).
    plugin: kafka
    enabled: ${DRISHTI_STREAM_WSS:false}
    kinds:
    - trade
    description: WSS's live trades, and the trade blotter's amendments written back to them
    settings:
      broker: default
      topics:
      - ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
      kind: trade
      id-field: DEAL_REF
      stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
      source-name: trade-wss-live
      where: SOURCE_SYSTEM = 'WSS'
      set:
        SOURCE_SYSTEM: WSS
      map: ${pack.dir}/mappings/wss-trade.yaml
    writes:
      amend-trade:                          # the trade blotter's command (modules/trading-systems/blotters/trade.live.yaml): one name, each system's own connector
        kind: trade
        kafka:
          topic: ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
          shape: document
          version-field: DEAL_VERSION
          changed-by: UPDATED_BY
          changed-at: LAST_UPD
          change-id-field: DRISHTI_CHANGE_ID
        confirm: reply
dataload: dataload.yaml
mappings:
  trade: mappings/wss-trade.yaml

roles:                         # an example role of this system: who sees its trades is a row rule on SOURCE_SYSTEM (KERNEL_AND_MODULES.md section 19.10)
  trader-wss:
    kinds:
    - trade
    edit: true
    rows:
      trade: "SOURCE_SYSTEM = 'WSS'"
    edit-systems:
    - WSS
